# Prometheus alerting rules feeding the circuit breaker. Metrics come from dcgm-exporter
# (deployed by the NVIDIA GPU Operator). Designed rules; checked with `promtool check rules`
# by the test suite when promtool is installed.
#
# Timing: `for: 15s` only means 15 s if the inputs are fresher than that. Scrape
# dcgm-exporter every 5 s and evaluate these groups every 5 s (both default to slower).
groups:
  - name: gpu-fatal
    interval: 5s
    rules:
      # dcgm-exporter reports the MOST RECENT Xid per GPU, so the value stays set after the
      # event. Requiring a recent change makes the alert resolve 10 minutes after the last
      # new Xid, which lets the breaker's cooldown start. A GPU that is still broken is caught
      # by GPUMissing below.
      # Fatal codes: 48 double-bit ECC, 79 fell off the bus, 95 uncontained ECC.
      # (74 is NVLink - these PCIe cards have none. 94 is a contained ECC error, usually
      # recoverable, so it pages a human instead of withdrawing the hub.)
      - alert: GPUFatalXid
        expr: |
          (DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 95)
          and changes(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
        for: 15s
        labels:
          severity: page
          route: breaker
          xid: "{{ $value }}"     # the breaker reads the Xid code from this label
        annotations:
          summary: "Fatal Xid {{ $value }} on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"

      # A GPU that falls off the bus (Xid 79) stops reporting, so its series disappear and no
      # per-GPU rule can fire for it. Count GPUs per host instead: a Phase B hub has 6.
      - alert: GPUMissing
        expr: count by (Hostname) (DCGM_FI_DEV_GPU_TEMP) < 6
        for: 15s
        labels:
          severity: page
          route: breaker
          gpu: "any"
        annotations:
          summary: "{{ $labels.Hostname }} reports {{ $value }} of 6 GPUs"

      - alert: DCGMExporterDown
        expr: up{job="dcgm-exporter"} == 0
        for: 15s
        labels:
          severity: page
          route: breaker
          gpu: "any"
        annotations:
          summary: "No GPU telemetry from {{ $labels.instance }}"

      # Sustained thermal throttling: a thermal clock-event bit is set AND the SM clock has
      # fallen well below the fastest GPU in the same chassis. The reasons field is a
      # bitmask; floor(x / 32) % 4 > 0 tests bits 5-6 (software and hardware thermal
      # slowdown). The peer-relative clock check keeps brief, harmless throttles from firing.
      - alert: GPUSustainedThermalThrottle
        expr: |
          (floor(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS / 32) % 4 > 0)
          and on(Hostname, gpu)
          (DCGM_FI_DEV_SM_CLOCK < on(Hostname) group_left 0.85 * max by (Hostname) (DCGM_FI_DEV_SM_CLOCK))
        for: 15s
        labels:
          severity: page
          route: breaker
        annotations:
          summary: "Thermal throttle on {{ $labels.Hostname }} GPU {{ $labels.gpu }}: stalls its whole TP group"

      - alert: GPURecoverableXid
        expr: DCGM_FI_DEV_XID_ERRORS == 94 and changes(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Contained ECC error (Xid 94) on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"

  - name: serving-early-warning
    rules:
      # Early warning, not a breaker input: the generative pod's paged KV cache filling up.
      # Triton's TensorRT-LLM backend exports block usage; "fraction" is used / max.
      - alert: KVCacheNearFull
        expr: avg_over_time(nv_trt_llm_kv_cache_block_metrics{kv_cache_block_type="fraction"}[2m]) > 0.9
        for: 2m
        labels: { severity: warn }
        annotations:
          summary: "KV cache above 90% on {{ $labels.pod }}"
